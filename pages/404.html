<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ページが見つかりません | 制作サンプル（React + TypeScript）</title>
    <script>
      // GitHub Pages はパスの書き換えに対応しないため、物理ファイルの存在しない
      // 要求はすべて 404 となる。要求されたパスをクエリ文字列へ退避したうえで
      // サンプル直下の index.html へ引き渡し、読み込み後に history API で復元する。
      // 保持するセグメント数はリポジトリ名 + <制作種別> + <業種の抽象名> の 3 とする。
      ;(function (l) {
        var SEGMENTS_TO_KEEP = 3
        var segments = l.pathname.split('/').slice(1)
        // 末尾のスラッシュが生む空の要素は、セグメントの数に含めない。
        var count = segments[segments.length - 1] === '' ? segments.length - 1 : segments.length
        if (count <= SEGMENTS_TO_KEEP) {
          // サンプルの基点そのものが存在しない場合は、案内を表示して転送しない。
          return
        }
        var base = '/' + segments.slice(0, SEGMENTS_TO_KEEP).join('/') + '/'
        var rest = segments.slice(SEGMENTS_TO_KEEP).join('/')
        if (base === l.pathname) {
          // 判定に漏れがあっても繰り返しに陥らないよう、自分自身へは転送しない。
          return
        }
        l.replace(
          l.origin +
            base +
            '?/' +
            rest.replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash,
        )
      })(window.location)
    </script>
    <style>
      /*
       * 配色と書体はトップページおよび収録サンプルと同じ値を用いる。
       * この画面が表示されるのは、サンプルの基点そのものが存在しない場合に限られる。
       */
      :root {
        --ink: #17191c;
        --gray: #6b7075;
        --line: #e3e5e8;
        --bg: #fafafa;
        --surface: #fff;
        --accent: #2563c9;
        --accent-d: #1c4ea3;

        --radius: 6px;
        --shadow: 0 1px 2px rgb(23 25 28 / 6%);
        --pad: clamp(1.25rem, 5vw, 3rem);

        font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo,
          system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.7;
        color: var(--ink);
        background-color: var(--bg);
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .wrap {
        width: 100%;
        max-width: 60rem;
        margin-inline: auto;
        padding-inline: var(--pad);
      }

      /* 案内を画面の中央寄りへ置く。脚注は常に下端へ残す。 */
      .main {
        display: flex;
        flex: 1;
        align-items: center;
        padding-block: clamp(2.5rem, 8vw, 5rem);
      }

      .panel {
        width: 100%;
        padding: clamp(1.5rem, 4vw, 2.25rem);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background-color: var(--surface);
        box-shadow: var(--shadow);
      }

      .panel__eyebrow {
        margin: 0 0 0.75rem;
        font-size: 0.7rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.22em;
        color: var(--gray);
      }

      .panel__title {
        margin: 0;
        font-size: clamp(1.25rem, 3vw, 1.6rem);
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .panel__lead {
        max-width: 56ch;
        margin: 0.875rem 0 0;
        font-size: 0.9rem;
        color: var(--gray);
      }

      .panel__back {
        margin: 1.5rem 0 0;
        font-size: 0.9rem;
      }

      .panel__back a {
        color: var(--accent);
      }

      .panel__back a:hover {
        color: var(--accent-d);
      }

      /* 帯は画面の幅いっぱいに敷き、内容だけを中央へ寄せる。 */
      .foot {
        padding-block: 1.5rem;
        border-top: 1px solid var(--line);
        font-size: 0.75rem;
        color: var(--gray);
      }

      .foot p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main class="main">
      <div class="wrap">
        <div class="panel">
          <p class="panel__eyebrow">404 NOT FOUND</p>
          <h1 class="panel__title">ページが見つかりません</h1>
          <p class="panel__lead">
            指定されたページは存在しません。URLをご確認のうえ、制作サンプルのトップからお進みください。
          </p>
          <p class="panel__back"><a href="/samples-react/">← 制作サンプルのトップへ</a></p>
        </div>
      </div>
    </main>

    <footer class="foot">
      <div class="wrap">
        <p>掲載しているサンプルはすべて架空の題材です。実在の企業・団体・個人とは一切関係しません。</p>
      </div>
    </footer>
  </body>
</html>
